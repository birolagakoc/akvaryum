<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canlı Akvaryum</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="auth-screen" class="auth-screen">
      <div class="auth-panel">
        <div class="auth-brand">
          <span class="brand-mark"></span>
          <div>
            <p class="eyebrow">SINIF AKVARYUMU</p>
            <h1>Öğretmen paneline giriş yap</h1>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Üyelik işlemi">
          <button class="auth-tab active" type="button" data-auth-mode="login">Giriş Yap</button>
          <button class="auth-tab" type="button" data-auth-mode="register">Üye Ol</button>
        </div>

        <form id="auth-form" class="auth-form">
          <label for="auth-username">Kullanıcı Adı</label>
          <input id="auth-username" type="text" minlength="3" maxlength="20" autocomplete="username" required />
          <label for="auth-password">Şifre</label>
          <input id="auth-password" type="password" minlength="4" maxlength="64" autocomplete="current-password" required />
          <p id="auth-error" class="auth-error" role="alert"></p>
          <button id="auth-submit" type="submit">Giriş Yap</button>
        </form>
      </div>
    </section>

    <div id="game-shell" class="game-shell is-hidden">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div><strong>Sınıf Akvaryumu</strong><small>Her öğrenciye bir balık</small></div>
        </div>

        <div class="account-bar">
          <span id="user-initial" class="user-initial">A</span>
          <div><small>ÖĞRETMEN</small><strong id="current-user">Kullanıcı</strong></div>
          <button id="logout-button" class="logout-button" type="button" title="Oturumu kapat">Çıkış</button>
        </div>

        <form id="class-form" class="class-form">
          <label for="class-select">Sınıf Seç</label>
          <select id="class-select" aria-label="Sınıf seç"></select>
          <label for="class-name">Yeni Sınıf</label>
          <div class="class-form-row">
            <input id="class-name" type="text" maxlength="24" placeholder="örn. 3/A" />
            <button type="submit">Ekle</button>
          </div>
        </form>

        <div class="member-browser">
          <label for="member-select">Diğer Akvaryumlar</label>
          <div class="member-browser-row">
            <select id="member-select" aria-label="Üye seç">
              <option value="">Üye bulunamadı</option>
            </select>
            <button id="view-member-button" type="button">Gör</button>
          </div>
          <button id="return-own-button" class="return-own-button" type="button" hidden>Kendi Akvaryumuma Dön</button>
        </div>

        <form id="fish-form" class="fish-form">
          <label for="fish-name">Öğrenci Adı</label>
          <input id="fish-name" type="text" maxlength="20" placeholder="örn. Ayşe" required />
          <label for="fish-type">Balık Türü</label>
          <select id="fish-type">
            <option value="goldfish">Japon Balığı</option>
            <option value="angelfish">Melek Balığı</option>
            <option value="betta">Beta</option>
            <option value="guppy">Lepistes</option>
          </select>
          <button type="submit">Öğrenci Balığı Ekle</button>
        </form>

        <div class="actions">
          <button id="feed-all" class="feed-all">Bugünün Sınıf Yemini Ver</button>
        </div>

        <section class="classroom-panel" aria-label="Sınıf takip listesi">
          <div class="classroom-panel-title">
            <span>Öğrenci Balıkları</span>
            <strong id="class-goal">0/0</strong>
          </div>
          <div id="student-list" class="student-list"></div>
        </section>

        <div class="hud">
          <div class="stat">
            <span>Öğrenciler</span>
            <strong id="fish-count">0</strong>
          </div>
          <div class="stat">
            <span>En Büyük Balık</span>
            <strong id="largest-fish">0 cm</strong>
          </div>
          <div class="stat status-box">
            <span>Sınıf Durumu</span>
            <strong id="status-text">Güzel</strong>
          </div>
        </div>
      </aside>

      <main class="aquarium-panel">
        <div class="top-bar">
          <div>
            <p class="eyebrow">SINIF AKVARYUMU</p>
            <h1 id="aquarium-title">Sınıf Akvaryumu</h1>
          </div>
          <div id="view-status" class="live-status"><span></span> Kendi akvaryumun</div>
        </div>

        <div id="aquarium" class="aquarium" aria-live="polite">
          <div class="water-caustics"></div>
          <div class="glass-reflection"></div>
          <div class="suspended-particles"></div>
          <div class="bubble bubble-1"></div>
          <div class="bubble bubble-2"></div>
          <div class="bubble bubble-3"></div>
          <div class="bubble bubble-4"></div>
          <div class="bubble bubble-5"></div>
          <div class="bubble bubble-6"></div>
          <div class="bubble bubble-7"></div>
          <div class="cleaning-bubbles cleaning-bubbles-left" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="cleaning-bubbles cleaning-bubbles-right" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <img class="shell-cluster shell-left" src="assets/seashells.png" alt="Deniz kabukları" />
          <img class="shell-cluster shell-right" src="assets/seashells.png" alt="" />
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
